services:
  links:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    ports:
      - 8080:8080
    environment:
      LINKS_KEYSET: ${KEYSET}
      SQLITE_PATH: /data/links.db
    volumes:
      - links_data:/data
  links-client:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    ports:
      - 9090:9090
    command: /app/client --server=9090
    environment:
      LINKS_PRIVATE_KEY: /keys/priv.pb
      LINKS_ADDR: http://links:8080
    depends_on:
      - links

volumes:
  links_data:
