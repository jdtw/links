name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.25.x
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
      - name: Integration Test
        run: ./test.sh
