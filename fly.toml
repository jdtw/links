# fly.toml app configuration file generated for jdtw on 2023-05-26T12:40:00-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "jdtw"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
  auto_rollback = true

[env]
  SKEW = "5s"

# Backing store for the SQLite database named by the SQLITE_PATH secret.
# The volume lives in sjc, matching the machine; a volume in another region
# cannot attach.
[[mounts]]
  source = "links_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
    restart_limit = 0
